[project]
name = "govmcp"
version = "0.1.0"
description = "GovMCP: US municipal zoning & environmental regulation data pipeline with MCP server (S3 data lake, DuckDB/Athena query layer)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "markdownify>=0.13",
    "mcp>=1.2,<2",
    "pyarrow>=17",
    "pypdf>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
govmcp-parse = "govmcp_parser.cli:main"
govmcp-serve = "govmcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govmcp_parser", "src/govmcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
